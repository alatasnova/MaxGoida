[project]
name = "max-goida"
version = "0.2.0"
description = "Сервис для агрегации, качественного тестирования и раздачи публичных прокси/VPN-конфигов (VLESS, VMess, Trojan, Shadowsocks) в обход блокировок"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "httpx[socks]>=0.28.1",
    "playwright>=1.50.0",
    "requests>=2.32.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
max-goida = "maxgoida.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxgoida"]
